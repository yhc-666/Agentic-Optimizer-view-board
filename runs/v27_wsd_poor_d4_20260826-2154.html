<script>
const RUN = JSON.parse(document.getElementById("run-data").textContent);
const NS = "http://www.w3.org/2000/svg";
const el = (tag, attrs = {}, text) => {
  const node = document.createElementNS(NS, tag);
  for (const k in attrs) node.setAttribute(k, attrs[k]);
  if (text != null) node.textContent = text;
  return node;
};
const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const fmt = n => n.toLocaleString();

// ---------------------------------------------------------------- header
document.getElementById("run-title").textContent = RUN.run_id;
{
  const c = RUN.config, a = RUN.accounting, f = RUN.fuel, s = RUN.score;
  const chips = [
    ["steps", fmt(RUN.total_steps)],
    ["batch", fmt(c.total_batch_size || 0) + " tok"],
    ["schedule", c.schedule || "?"],
    ["base LR ×", c.base_lr_scale],
    ["β1/β2 起始", `${c.beta1} / ${c.beta2}`],
    ["K", c.review_every],
    ["reviews", RUN.reviews.length],
    ["分支", RUN.branches.length],
    ["移动", a.move_count ?? "—"],
    ["燃料已花", f.spent_steps != null ? `${fmt(f.spent_steps)} 步` : "—"],
    ["燃料剩余", f.remaining_steps != null && f.total_steps
        ? `${fmt(f.remaining_steps)} 步 (${Math.round(100 * f.remaining_steps / f.total_steps)}%)` : "—"],
    [s ? `score 末${s.score_window_steps}步` : "score", s ? s.final_train_loss_mean.toFixed(4) : "未完成"],
  ];
  document.getElementById("run-chips").innerHTML =
    chips.map(([k, v]) => `${k} <b>${v}</b>`).join("");
}

// ---------------------------------------------------------------- tree
const laneOf = new Map(RUN.branches.map((b, i) => [b.branch, i]));
const byBranch = new Map(RUN.branches.map(b => [b.branch, b]));
const reviewById = new Map(RUN.reviews.map(r => [r.review_id, r]));
const moveOf = r => ((r.action && r.action.result && r.action.result.move) || null);
// Half-lives are the agent's way of typing a beta; the page shows betas only.
const HIDDEN_CONFIG_KEYS = new Set(["beta1_half_life", "beta2_half_life"]);
let selectedId = null;

function drawTree() {
  const svg = document.getElementById("tree");
  svg.innerHTML = "";
  const lanes = RUN.branches.length;
  const M = { top: 14, right: 26, bottom: 30, left: 46 };
  const W = Math.max(760, 150 + RUN.total_steps * 0.16);
  const laneH = 36;
  const H = M.top + M.bottom + Math.max(1, lanes - 1) * laneH;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.setAttribute("preserveAspectRatio", "xMinYMin meet");
  svg.style.width = "100%";
  svg.style.minWidth = Math.min(W, 720) + "px";
  svg.style.height = "auto";

  const x = step => M.left + (step / Math.max(RUN.total_steps, 1)) * (W - M.left - M.right);
  const y = branch => M.top + laneOf.get(branch) * laneH;

  for (const tick of ticks(0, RUN.total_steps, 6)) {
    svg.appendChild(el("line", { x1: x(tick), x2: x(tick), y1: M.top - 6, y2: H - M.bottom + 6,
                                 stroke: css("--grid"), "stroke-width": 1 }));
    svg.appendChild(el("text", { x: x(tick), y: H - M.bottom + 20, "text-anchor": "middle",
                                 class: "lane-label", fill: css("--ink3") }, fmt(Math.round(tick))));
  }

  for (const b of RUN.branches) {
    const live = b.on_path;
    const colour = live ? css("--change") : css("--dead");
    const x0 = x(b.fork_step);
    const x1 = x(b.last_step ?? b.fork_step);
    svg.appendChild(el("line", { x1: x0, x2: x1, y1: y(b.branch), y2: y(b.branch),
                                 stroke: colour, "stroke-width": live ? 3.2 : 1.6,
                                 "stroke-linecap": "round" }));
    svg.appendChild(el("text", { x: M.left - 10, y: y(b.branch) + 4, "text-anchor": "end",
                                 class: "lane-label", fill: live ? css("--ink") : css("--ink3") },
                       "b" + b.branch));
    if (b.parent !== null) {                      // fork connector, bowed clear of crossed lanes
      const span = Math.abs(laneOf.get(b.branch) - laneOf.get(b.parent));
      const cx = x0 + 8 + span * 5;
      svg.appendChild(el("path", {
        d: `M ${x0} ${y(b.parent)} Q ${cx} ${(y(b.parent) + y(b.branch)) / 2} ${x0} ${y(b.branch)}`,
        fill: "none", stroke: colour, "stroke-width": 1.5,
      }));
    }
  }

  for (const r of RUN.reviews) {
    const mv = moveOf(r);                         // jump to the checkpoint it restored
    if (mv) {
      const target = reviewById.get(mv.target_review);
      if (target) {
        svg.appendChild(el("path", {
          d: `M ${x(r.step)} ${y(r.branch)} Q ${(x(r.step) + x(target.step)) / 2} ${y(r.branch) - 12} ${x(target.step)} ${y(target.branch)}`,
          fill: "none", stroke: css("--move"), "stroke-width": 1.4,
          "stroke-dasharray": "4 3",
        }));
      }
    }
  }

  // A changed config belongs to the branch that RUNS it, so the label sits where
  // it first takes effect: the new branch's fork point after a move, otherwise
  // this review's own position. Sides alternate to avoid collisions.
  const lastLabel = new Map();
  for (const r of RUN.reviews) {
    if (!r.changes || !r.changes.length) continue;
    const mv = moveOf(r);
    const lane = mv ? mv.new_branch : r.branch;
    const at = mv ? mv.landed_step : r.step;
    if (!laneOf.has(lane)) continue;
    const prev = lastLabel.get(lane) || { x: -1e9, side: -1 };
    const side = (at - prev.x) < RUN.total_steps * 0.11 ? -prev.side : 1;
    lastLabel.set(lane, { x: at, side });
    svg.appendChild(el("text", {
      x: x(at) + 12, y: y(lane) + (side > 0 ? -10 : 16),
      class: "node-label", fill: css("--ink2"),
    }, r.changes.join(" ")));
  }

  for (const r of RUN.reviews) {
    const colour = css("--" + r.kind);
    const g = el("g", { class: "node", tabindex: "0", role: "button" });
    g.appendChild(el("circle", { class: "halo", cx: x(r.step), cy: y(r.branch), r: 11,
                                 fill: colour, opacity: r.review_id === selectedId ? .3 : 0 }));
    g.appendChild(el("circle", {
      cx: x(r.step), cy: y(r.branch), r: r.kind === "noop" ? 4 : 5.5,
      fill: r.kind === "noop" ? css("--panel") : colour,
      stroke: r.kind === "noop" ? colour : css("--surface"), "stroke-width": 1.8,
    }));
    g.appendChild(el("title", {}, `${r.review_id} · b${r.branch}@${r.step}`));
    const pick = () => select(r.review_id);
    g.addEventListener("click", pick);
    g.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pick(); } });
    svg.appendChild(g);
  }
}

function ticks(lo, hi, count) {
  const raw = (hi - lo) / count;
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => s >= raw) || mag * 10;
  const out = [];
  for (let v = Math.ceil(lo / step) * step; v <= hi + 1e-9; v += step) {
    out.push(Math.abs(v) < 1e-9 ? 0 : v);        // keep fractions: y axes need them
  }
  return out;
}

// ---------------------------------------------------------------- curves
const METRICS = [
  { key: "loss", label: "train loss", kind: "window" },
  { key: "grad_norm", label: "grad norm", kind: "window" },
  { key: "update_to_weight", label: "update/weight", kind: "window" },
  { key: "momentum_alignment", label: "momentum align", kind: "window" },
  { key: "grad_sq_vs_v", label: "g² vs v̂", kind: "window" },
  { key: "lr_multiplier", label: "lr ×", kind: "config" },
  { key: "beta1", label: "β1", kind: "config" },
  { key: "beta2", label: "β2", kind: "config" },
];
let metric = METRICS[0];
let showPath = true;                              // the stitched lineage, on by default
let shownBranches = new Set();                    // individual branches, for comparison

// The active path is one continuous curve cut into several branch segments by
// the forks; each parent contributes only the steps below where its child forked
// off. Stitch the segments before plotting so the line stays unbroken.
function pathSeries() {
  const parts = [];
  for (const info of RUN.branches) {
    if (!info.on_path) continue;
    const until = info.path_until;
    for (const p of seriesFor(info.branch)) {
      if (until === null || until === undefined || p[0] <= until) parts.push(p);
    }
  }
  return parts.sort((a, b) => a[0] - b[0]);
}

function seriesFor(branch) {
  if (metric.kind === "config") {
    const pts = ((RUN.config_points[branch] || {})[metric.key]) || [];
    const info = byBranch.get(branch);
    const out = [];
    pts.forEach(([s, v], i) => {                  // step function -> staircase
      const next = i + 1 < pts.length ? pts[i + 1][0] : (info.last_step ?? s) + 1;
      out.push([s, v], [next, v]);
    });
    return out;
  }
  return (RUN.windows[branch] || []).filter(w => w[metric.key])
                                    .map(w => [w.step, w[metric.key][0]]);
}

function drawCurve() {
  const svg = document.getElementById("curve");
  svg.innerHTML = "";
  const M = { top: 12, right: 16, bottom: 30, left: 60 };
  const W = Math.max(760, 150 + RUN.total_steps * 0.16), H = 300;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.setAttribute("preserveAspectRatio", "xMinYMin meet");
  svg.style.width = "100%";
  svg.style.minWidth = Math.min(W, 720) + "px";
  svg.style.height = "auto";

  const shown = [...shownBranches];
  const layers = [];
  if (showPath) layers.push({ key: "path", label: "active path", pts: pathSeries(), live: true });
  for (const b of shown) {
    layers.push({ key: "b" + b, label: "b" + b, pts: seriesFor(b), live: byBranch.get(b).on_path });
  }
  const all = layers.flatMap(l => l.pts);
  if (!all.length) {
    svg.appendChild(el("text", { x: W / 2, y: H / 2, "text-anchor": "middle", fill: css("--ink3") },
                       "该指标在所选分支上没有数据"));
    return;
  }
  let lo = Math.min(...all.map(p => p[1])), hi = Math.max(...all.map(p => p[1]));
  if (hi - lo < 1e-9) { lo -= 0.5; hi += 0.5; }
  const pad = (hi - lo) * 0.08;
  lo -= pad; hi += pad;

  const x = s => M.left + (s / Math.max(RUN.total_steps, 1)) * (W - M.left - M.right);
  const y = v => M.top + (1 - (v - lo) / (hi - lo)) * (H - M.top - M.bottom);

  for (const v of ticks(lo, hi, 5)) {
    svg.appendChild(el("line", { x1: M.left, x2: W - M.right, y1: y(v), y2: y(v),
                                 stroke: css("--grid"), "stroke-width": 1 }));
    svg.appendChild(el("text", { x: M.left - 8, y: y(v) + 4, "text-anchor": "end",
                                 class: "lane-label", fill: css("--ink3") }, formatTick(v, hi - lo)));
  }
  for (const t of ticks(0, RUN.total_steps, 6)) {
    svg.appendChild(el("text", { x: x(t), y: H - 10, "text-anchor": "middle",
                                 class: "lane-label", fill: css("--ink3") }, fmt(Math.round(t))));
  }

  for (const layer of layers) {
    const pts = layer.pts;
    if (!pts.length) continue;
    const isPath = layer.key === "path";
    const colour = isPath ? css("--change") : layer.live ? css("--accent") : css("--dead");
    const live = isPath;
    svg.appendChild(el("polyline", {
      points: pts.map(p => `${x(p[0])},${y(p[1])}`).join(" "),
      fill: "none", stroke: colour, "stroke-width": live ? 2 : 1.4,
      "stroke-dasharray": live ? "none" : "5 3",
      "stroke-linejoin": "round",
    }));
    const last = pts[pts.length - 1];
    svg.appendChild(el("text", { x: x(last[0]) + 5, y: y(last[1]) + 4, class: "lane-label", fill: colour },
                       layer.label));
  }

  const sel = selectedId && reviewById.get(selectedId);
  if (sel) {
    svg.appendChild(el("line", { x1: x(sel.step), x2: x(sel.step), y1: M.top, y2: H - M.bottom,
                                 stroke: css("--move"), "stroke-width": 1, "stroke-dasharray": "3 3" }));
  }
  document.getElementById("curve-note").textContent =
    metric.kind === "window"
      ? `窗口宽度 ${RUN.bin_size} 步；窗口在各分支上对齐，同一窗口吃的是同一批数据`
      : "超参是阶梯函数，只画变化点";
}

function formatTick(v, span) {
  const digits = span > 5 ? 1 : span > 0.5 ? 2 : span > 0.05 ? 3 : 4;
  return v.toFixed(digits);
}

// ---------------------------------------------------------------- detail
function select(id, pushHash = true) {
  selectedId = id;
  // deep link: viewer.html#R0007 opens straight at that review
  if (pushHash && id) history.replaceState(null, "", "#" + id);
  drawTree();
  drawCurve();
  renderDetail();
  document.getElementById("detail").scrollIntoView({ block: "nearest", behavior: "smooth" });
}

const esc = s => String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
const pretty = v => typeof v === "string" ? v : JSON.stringify(v, null, 2);

function block(text, limit = 700) {
  const full = pretty(text);
  if (full.length <= limit) return `<pre>${esc(full)}</pre>`;
  return `<pre>${esc(full.slice(0, limit))}…</pre>
    <details><summary>展开全部 ${fmt(full.length)} 字符</summary><pre>${esc(full)}</pre></details>`;
}

function renderDetail() {
  const host = document.getElementById("detail");
  const r = selectedId && reviewById.get(selectedId);
  if (!r) {
    host.innerHTML = `<div class="empty">在左侧操作树上点一个节点${RUN.reviews.length ? "" : "（这条 run 没有 agent review）"}</div>`;
    return;
  }
  const kindLabel = { move: "移动", change: "改参", noop: "no-op" }[r.kind];
  const call = (r.action || {}).call, result = (r.action || {}).result;
  const summary = r.final_summary || {};
  const before = r.config_before || {}, after = r.config_after || {};
  const shownKeys = Object.keys(after).filter(k => !HIDDEN_CONFIG_KEYS.has(k));
  const changed = shownKeys.filter(k => before[k] !== after[k]);

  const parts = [];
  parts.push(`<h3>${r.review_id} <span class="pill ${r.kind}">${kindLabel}</span></h3>`);
  parts.push(`<div class="sub mono">branch ${r.branch} · step ${fmt(r.step)} · ${r.rounds.length} 轮请求 · ${
    r.wall_clock_s != null ? r.wall_clock_s.toFixed(1) + "s" : "?"} · ${r.end_reason || ""}</div>`);

  parts.push('<dl class="kv">');
  parts.push(`<dt>配置</dt><dd class="mono">${
    changed.length
      ? changed.map(k => `${k}: ${before[k]} → <b>${after[k]}</b>`).join("<br>")
      : shownKeys.map(k => `${k}: ${after[k]}`).join(" · ") || "—"}</dd>`);
  if (result && result.move) {
    const mv = result.move;
    // signed by protocol: positive = fuel charged, negative = refund (forward jump)
    const fuel = mv.fuel_cost_steps >= 0
      ? `扣 ${fmt(mv.fuel_cost_steps)} 步` : `退 ${fmt(-mv.fuel_cost_steps)} 步`;
    parts.push(`<dt>移动</dt><dd class="mono">→ ${mv.target_review} (step ${fmt(mv.landed_step)}) · 开 branch ${
      mv.new_branch} · 燃料 ${fuel}${result.fuel_remaining_steps != null
        ? ` · 余 ${fmt(result.fuel_remaining_steps)} 步` : ""}</dd>`);
  }
  parts.push("</dl>");

  if (call) parts.push(`<details open><summary>apply_action 调用与结果</summary>
    ${block(call, 400)}${block(result, 900)}</details>`);

  const fields = [
    ["one_sentence_summary", "一句话"], ["run_summary", "全程叙事"],
    ["previous_action_review", "上轮预期复盘"], ["current_observation", "本轮观察"],
    ["action_reason", "决策理由"], ["remaining_budget_plan", "剩余预算计划"],
    ["next_expectation", "下轮预期"],
  ].filter(([k]) => summary[k]);
  if (fields.length) {
    parts.push(`<details open><summary>final summary</summary>` +
      fields.map(([k, label]) =>
        `<div class="summary-field"><div class="label">${label}</div>${esc(summary[k])}</div>`).join("") +
      `</details>`);
  }

  parts.push(`<details><summary>开场 state packet</summary>${block(r.state_packet, 0)}</details>`);

  r.rounds.forEach((rd, i) => {
    const calls = ((rd.response || {}).tool_calls) || [];
    const names = calls.map(c => c.function.name);
    const tally = names.reduce((m, n) => (m[n] = (m[n] || 0) + 1, m), {});
    const label = names.length
      ? Object.entries(tally).map(([n, c]) => c > 1 ? `${n}×${c}` : n).join(", ")
      : "无工具调用（收尾）";
    parts.push(`<details><summary>轮 ${i + 1} <span class="round-tools">${esc(rd.request_id || "")} · ${esc(label)}</span></summary>`);
    if ((rd.response || {}).content) {
      parts.push(`<div class="summary-field"><div class="label">模型文本</div>${block((rd.response).content)}</div>`);
    }
    calls.forEach((c, j) => {
      const res = (rd.tool_results || [])[j];
      parts.push(`<div class="summary-field"><div class="label"><span class="call-name">${esc(c.function.name)}</span> 参数</div>${
        block(c.function.arguments, 300)}<div class="label" style="margin-top:6px">返回</div>${block(res, 700)}</div>`);
    });
    parts.push("</details>");
  });

  host.innerHTML = parts.join("");
}

// ---------------------------------------------------------------- controls
{
  const host = document.getElementById("metric-buttons");
  METRICS.forEach(m => {
    const b = document.createElement("button");
    b.textContent = m.label;
    b.setAttribute("aria-pressed", m === metric);
    b.onclick = () => {
      metric = m;
      [...host.children].forEach(c => c.setAttribute("aria-pressed", c === b));
      drawCurve();
    };
    host.appendChild(b);
  });
}
{
  const host = document.getElementById("branch-buttons");
  const pathBtn = document.createElement("button");
  pathBtn.textContent = "active path";
  pathBtn.title = "最终 lineage，沿 fork 点拼接成一条连续曲线";
  pathBtn.setAttribute("aria-pressed", showPath);
  pathBtn.onclick = () => {
    showPath = !showPath;
    pathBtn.setAttribute("aria-pressed", showPath);
    drawCurve();
  };
  host.appendChild(pathBtn);
  host.appendChild(Object.assign(document.createElement("span"),
    { className: "hint", textContent: "叠加单支：", style: "align-self:center;margin:0 2px 0 10px" }));
  RUN.branches.forEach(info => {
    const b = document.createElement("button");
    b.textContent = "b" + info.branch + (info.on_path ? "" : " ·");
    b.title = info.on_path ? "最终 lineage" : "已放弃的分支";
    b.setAttribute("aria-pressed", shownBranches.has(info.branch));
    b.onclick = () => {
      shownBranches.has(info.branch) ? shownBranches.delete(info.branch) : shownBranches.add(info.branch);
      b.setAttribute("aria-pressed", shownBranches.has(info.branch));
      drawCurve();
    };
    host.appendChild(b);
  });
}

const fromHash = location.hash.slice(1);
if (fromHash && reviewById.has(fromHash)) selectedId = fromHash;
drawTree();
drawCurve();
renderDetail();
addEventListener("hashchange", () => {
  const id = location.hash.slice(1);
  if (reviewById.has(id)) select(id, false);
});
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { drawTree(); drawCurve(); });
</script>
</body>
